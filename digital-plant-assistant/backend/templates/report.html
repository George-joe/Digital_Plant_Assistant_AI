<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Report – GrowZen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <style>
        .report-card { max-width: 600px; margin: 40px auto; padding: 24px; border-radius: 16px; background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .report-img { width: 100%; border-radius: 12px; margin-bottom: 20px; object-fit: cover; max-height: 400px; }
        .report-title { font-size: 24px; font-weight: 700; color: var(--gray-900); }
        .report-meta { display: flex; gap: 12px; margin: 12px 0; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-green { background: #dcfce7; color: #166534; }
    </style>
</head>
<body style="background: var(--gray-50); font-family: 'Inter', sans-serif;">
    <div class="report-card">
        {% if report.image_path %}
            <!-- Step 4 Fix: Using url_for with static and relative image_path -->
            <img src="{{ url_for('static', filename=report.image_path) }}" alt="Plant Leaf" class="report-img">
        {% else %}
            <div style="height:200px; background:#f3f4f6; display:flex; align-items:center; justify-content:center; border-radius:12px; margin-bottom:20px; color:#9ca3af;">No image available</div>
        {% endif %}

        <h1 class="report-title">{{ report.diagnosis }}</h1>
        
        <div class="report-meta">
            <span class="badge {% if 'Healthy' in report.diagnosis %}badge-green{% else %}badge-red{% endif %}">
                {{ report.severity }} Severity
            </span>
            <span style="color: var(--gray-500); font-size: 14px;">Confidence: {{ report.probability }}%</span>
        </div>

        <div style="margin-top: 24px;">
            <h3 style="font-size: 16px; margin-bottom: 8px;">Treatment Information</h3>
            <p style="color: var(--gray-700); line-height: 1.6;">{{ report.treatment or 'No specific treatment suggested.' }}</p>
        </div>

        <div style="margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--gray-100);">
            <a href="/dashboard" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
