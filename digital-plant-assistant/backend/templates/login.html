<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login – GrowZen</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

  <div class="auth-container">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to continue caring for your plants</p>

      <form id="loginForm">

        <div class="input-group">
          <label>Email</label>
          <input id="loginEmail" type="email" placeholder="you@example.com" required>
        </div>

        <div class="input-group">
          <label>Password</label>
          <input id="loginPassword" type="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="primary-btn full">Sign In</button>
      </form>

      <p class="switch">
        Don’t have an account? <a href="{{ url_for('ui.signup') }}">Sign up</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.error || "Login failed");
          return;
        }

        /* Save current logged user */
        localStorage.setItem("user", JSON.stringify(data.user));
        localStorage.setItem("userId", data.user.id);
        /* login -> dashboard (Existing User) */
        localStorage.setItem("isNewUser", "false");
        console.log("User:", localStorage.getItem("user"));
        console.log("isNewUser:", localStorage.getItem("isNewUser"));
        window.location.href = "{{ url_for('ui.dashboard') }}";
      } catch (err) {
        console.error("Login error:", err);
        alert("Error connecting to auth server. Please ensure the backend is running.");
      }
    });
  </script>

</body>

</html>
